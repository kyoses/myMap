name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 配置 JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 预置 Android SDK 许可证
    #    必须排在 setup-android 之前 —— 否则它安装组件时才发现许可证没接受。
    #    不能用 setup-android 自带的 --licenses 流程：它向交互提示只喂固定
    #    数量的 y，runner 上待确认的许可证有 7 个，走到一半就退出，步骤失败。
    #    这里直接写许可证哈希，完全避开交互。哈希取自 sdkmanager --licenses 的产物。
    - name: Accept Android SDK licenses
      run: |
        set -euo pipefail
        LICENSES_DIR="${ANDROID_SDK_ROOT}/licenses"
        mkdir -p "$LICENSES_DIR"
        accept_license() {
          printf '%s\n' "$2" > "${LICENSES_DIR}/$1"
        }
        accept_license android-sdk-license 24333f8a63b6825ea9c5514f83c2829b004d1fee
        accept_license android-sdk-preview-license 84831b9409646a918e30573bab4c9c91346d8abd
        accept_license android-sdk-arm-dbt-license 859f317696f67ef3d7f30a50a5560e7834b43903
        accept_license android-googletv-license 601085b94cd77f0b54ff86406957099ebe79c4d6
        accept_license android-googlexr-license ceff83576aac4f7f37cb98fe189e9fb3c49d3b81
        accept_license google-gdk-license 33b6a2b64607f11b759f320ef9dff4ae5c47d97a
        accept_license microxr-sysimage-license 3a7848b1d7366ca5cfa0be477627644ca73f47e3
        accept_license mips-android-sysimage-license e9acab5b5fbb560a72cfaecce8946896ff6aab9d
        ls -l "$LICENSES_DIR"

    # 4. 安装 Android SDK
    #    组件安装交给 setup-android 的 packages 参数：它用的是与当前仓库 XML
    #    匹配的那份 sdkmanager（装在 cmdline-tools/<版本号> 目录），不是
    #    runner 镜像自带的 latest（那份版本旧，解析仓库 XML 会失败）。
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: false
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    # 5. 校验 SDK 组件
    #    GitHub runner 镜像已预装 platforms;android-35、build-tools;35.0.0
    #    和 platform-tools（build_tools_min_version 为 34.0.0，会装所有 >=34
    #    的版本）。这里校验一下，缺失就直接报错，不做重复安装。
    - name: Verify SDK packages
      run: |
        set -euo pipefail
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
        ls -l "${ANDROID_SDK_ROOT}/cmdline-tools/" || true
        ls -l "${ANDROID_SDK_ROOT}/platforms/" || true
        ls -l "${ANDROID_SDK_ROOT}/build-tools/" || true
        missing=0
        for item in "platforms/android-35" "build-tools/35.0.0" "platform-tools"; do
          if [ ! -d "${ANDROID_SDK_ROOT}/${item}" ]; then
            echo "::error::缺少 SDK 组件: ${item}"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        echo "SDK 组件齐备"

    # 6. 注入百度地图 AK（未配置 secret 时留空，不影响编译）
    - name: Configure Baidu Map AK
      run: |
        echo "baiduMapAk=${{ secrets.BAIDU_MAP_AK }}" >> gradle.properties
        echo "baiduTtsAppId=${{ secrets.BAIDU_TTS_APP_ID }}" >> gradle.properties
        echo "baiduTtsAppKey=${{ secrets.BAIDU_TTS_APP_KEY }}" >> gradle.properties
        echo "baiduTtsSecretKey=${{ secrets.BAIDU_TTS_SECRET_KEY }}" >> gradle.properties
        echo "baiduTtsAuthSn=${{ secrets.BAIDU_TTS_AUTH_SN }}" >> gradle.properties
        cat gradle.properties

    # 7. 编译 Debug APK
    #    百度地图 SDK 不支持 x86/x86_64，模拟器上只有 arm64 与 armv7 架构可用
    - name: Build debug APK
      run: ./gradlew assembleDebug -Pandroid.injected.invoked.from.ide=true

    # 8. 运行单元测试
    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest

    # 9. 上传构建好的 APK 产物
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mymap-debug-apk
        path: app/build/outputs/apk/debug/*.apk
