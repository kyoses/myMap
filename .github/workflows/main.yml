name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 允许你手动在网页上点按钮触发编译

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Java 17 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 安装 Android SDK（包含你需要的 SDK 35 和 Build Tools 35.0.0）
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # 4. 安全注入百度地图 AK (不泄露到代码中)
    - name: Configure Baidu Map AK
      run: |
        echo "baiduMapAk=${{ secrets.BAIDU_MAP_AK }}" >> gradle.properties
        cat gradle.properties

    # 5. 授权 Gradle 执行脚本权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 6. 清理并编译 APK
    #    百度地图 SDK 不支持 x86/x86_64，这里只打 arm64 和 armv7 的包
    - name: Build debug APK
      run: ./gradlew clean assembleDebug -Pandroid.injected.invoked.from.ide=true

    # 7. (解决中文路径坑) 移动到纯英文路径下运行单元测试
    - name: Run Unit Tests (Fix Chinese Path Issue)
      run: |
        mkdir -p /tmp/myMapTest
        cp -R . /tmp/myMapTest/
        cd /tmp/myMapTest
        chmod +x gradlew
        ./gradlew :app:testDebugUnitTest

    # 8. 上传编译好的 APK 产物
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mymap-debug-apk
        path: app/build/outputs/apk/debug/*.apk