name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 配置 JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 安装 Android SDK（需要 SDK 35 与 Build Tools 35.0.0）
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # 4. 注入百度地图 AK（未配置 secret 时留空，不影响编译）
    - name: Configure Baidu Map AK
      run: |
        echo "baiduMapAk=${{ secrets.BAIDU_MAP_AK }}" >> gradle.properties
        echo "baiduTtsAppId=${{ secrets.BAIDU_TTS_APP_ID }}" >> gradle.properties
        echo "baiduTtsAppKey=${{ secrets.BAIDU_TTS_APP_KEY }}" >> gradle.properties
        echo "baiduTtsSecretKey=${{ secrets.BAIDU_TTS_SECRET_KEY }}" >> gradle.properties
        echo "baiduTtsAuthSn=${{ secrets.BAIDU_TTS_AUTH_SN }}" >> gradle.properties
        cat gradle.properties

    # 5. 赋予 Gradle 脚本执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 6. 编译 Debug APK
    #    百度地图 SDK 不支持 x86/x86_64，模拟器上只有 arm64 与 armv7 架构可用
    - name: Build debug APK
      run: ./gradlew assembleDebug -Pandroid.injected.invoked.from.ide=true

    # 7. 运行单元测试
    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest

    # 8. 上传构建好的 APK 产物
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mymap-debug-apk
        path: app/build/outputs/apk/debug/*.apk
