name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 配置 JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 安装 Android SDK（需要 SDK 35 与 Build Tools 35.0.0）
    #    两个注意点：
    #    a) 不能用 setup-android 的默认许可证流程 —— 它向 sdkmanager --licenses
    #       的交互提示只喂固定数量的 y，runner 上待确认的许可证有 7 个，
    #       走到一半就退出，步骤直接失败。改为自己写许可证哈希文件。
    #    b) runner 镜像预装的 cmdline-tools/latest 版本偏旧，解析新版仓库 XML
    #       会报 package.xml parsing problem 并以退出码 1 结束。setup-android
    #       会另外下载匹配版本装到 cmdline-tools/22.0，下面固定用那个路径。
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: false
        packages: ''

    - name: Accept Android SDK licenses
      run: |
        set -euo pipefail
        LICENSES_DIR="${ANDROID_SDK_ROOT}/licenses"
        mkdir -p "$LICENSES_DIR"
        accept_license() {
          printf '%s\n' "$2" > "${LICENSES_DIR}/$1"
        }
        accept_license android-sdk-license 24333f8a63b6825ea9c5514f83c2829b004d1fee
        accept_license android-sdk-preview-license 84831b9409646a918e30573bab4c9c91346d8abd
        accept_license android-sdk-arm-dbt-license 859f317696f67ef3d7f30a50a5560e7834b43903
        accept_license android-googletv-license 601085b94cd77f0b54ff86406957099ebe79c4d6
        accept_license android-googlexr-license ceff83576aac4f7f37cb98fe189e9fb3c49d3b81
        accept_license google-gdk-license 33b6a2b64607f11b759f320ef9dff4ae5c47d97a
        accept_license microxr-sysimage-license 3a7848b1d7366ca5cfa0be477627644ca73f47e3
        accept_license mips-android-sysimage-license e9acab5b5fbb560a72cfaecce8946896ff6aab9d
        ls -l "$LICENSES_DIR"

    # 4. 安装 SDK 组件
    - name: Install SDK packages
      run: |
        set -euo pipefail
        # 不要硬编码版本号：setup-android 的默认 cmdline-tools 版本会随 action
        # 版本变化（v3 是 16.0，v4 是 22.0）。
        # 优先用 setup-android 装好的带版本号目录 —— 它的版本与当前仓库 XML
        # 匹配；runner 镜像自带的 latest 较旧，解析新版仓库 XML 会报
        # package.xml parsing problem 并以退出码 1 结束，只作为兜底。
        SDKMANAGER=""
        for dir in $(ls -d "${ANDROID_SDK_ROOT}"/cmdline-tools/*/ 2>/dev/null | sort -V); do
          case "$(basename "$dir")" in
            latest) continue ;;
          esac
          if [ -x "${dir}bin/sdkmanager" ]; then
            SDKMANAGER="${dir}bin/sdkmanager"
          fi
        done
        if [ -z "$SDKMANAGER" ]; then
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        fi
        if [ ! -x "$SDKMANAGER" ]; then
          echo "::error::未找到可用的 sdkmanager"
          ls -l "${ANDROID_SDK_ROOT}/cmdline-tools/" || true
          exit 1
        fi
        echo "使用 $SDKMANAGER"
        yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" \
          "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        ls -l "${ANDROID_SDK_ROOT}/platforms" "${ANDROID_SDK_ROOT}/build-tools"

    # 5. 注入百度地图 AK（未配置 secret 时留空，不影响编译）
    - name: Configure Baidu Map AK
      run: |
        echo "baiduMapAk=${{ secrets.BAIDU_MAP_AK }}" >> gradle.properties
        echo "baiduTtsAppId=${{ secrets.BAIDU_TTS_APP_ID }}" >> gradle.properties
        echo "baiduTtsAppKey=${{ secrets.BAIDU_TTS_APP_KEY }}" >> gradle.properties
        echo "baiduTtsSecretKey=${{ secrets.BAIDU_TTS_SECRET_KEY }}" >> gradle.properties
        echo "baiduTtsAuthSn=${{ secrets.BAIDU_TTS_AUTH_SN }}" >> gradle.properties
        cat gradle.properties

    # 6. 编译 Debug APK
    #    百度地图 SDK 不支持 x86/x86_64，模拟器上只有 arm64 与 armv7 架构可用
    - name: Build debug APK
      run: ./gradlew assembleDebug -Pandroid.injected.invoked.from.ide=true

    # 7. 运行单元测试
    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest

    # 8. 上传构建好的 APK 产物
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mymap-debug-apk
        path: app/build/outputs/apk/debug/*.apk
