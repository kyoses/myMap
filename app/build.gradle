plugins {
    id 'com.android.application'
}

// 密钥从 local.properties 读取（该文件不入库），gradle.properties 会被提交，
// 不能用来放 AK。local.properties 优先，其次是 -P 参数或 gradle.properties。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def resolveSecret = { String name ->
    return localProps.getProperty(name) ?:
            project.findProperty(name) ?:
            (project.hasProperty(name) ? project.property(name) : '')
}

android {
    namespace 'com.example.mymap'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.mymap"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // 百度地图 AK 与 TTS 授权参数通过 manifestPlaceholders 注入，避免把密钥写死在源码里。
        manifestPlaceholders = [
                BAIDU_MAP_AK        : resolveSecret('baiduMapAk'),
                BAIDU_TTS_APP_ID    : resolveSecret('baiduTtsAppId'),
                BAIDU_TTS_APP_KEY   : resolveSecret('baiduTtsAppKey'),
                BAIDU_TTS_SECRET_KEY: resolveSecret('baiduTtsSecretKey'),
                BAIDU_TTS_AUTH_SN   : resolveSecret('baiduTtsAuthSn')
        ]

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // 规避 Android 的 64K 引用限制
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }

    sourceSets {
        test {
            resources.srcDirs += ["src/main/res"]
        }
    }
}

// Kotlin 1.8 起 kotlin-stdlib 已包含 jdk7/jdk8 的内容，Glide 传递进来的旧版
// kotlin-stdlib-jdk7/jdk8 会与之产生重复类，这里统一排除。
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // 驾车导航组件（含地图能力）
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Map-Navi:8.2.0.2'
    // 基础定位组件（与 Location_All 二选一）
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Location:9.6.5.1'
    // 导航内部 Glide 适配层（与 Glide 4.x 配套）
    implementation 'com.baidu.lbsyun:BNGlide4:1.0.1'
    // 导航语音播报（TTS）组件
    implementation 'com.baidu.lbsyun:NaviTts:3.2.13'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.core:core-ktx:1.12.0'

    // 导航底部导航栏依赖，缺失会导致底栏不显示
    implementation 'com.airbnb.android:lottie:3.6.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
